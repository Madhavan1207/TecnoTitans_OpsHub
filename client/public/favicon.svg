<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favGlow" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A0F18" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="favLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD0A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#1D4FB5" />
    </linearGradient>
  </defs>

  <!-- Dark Shield Background -->
  <rect width="64" height="64" rx="14" fill="#0A0F18" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="26" fill="url(#favGlow)" />

  <!-- Orbital Data Ring -->
  <ellipse cx="32" cy="32" rx="24" ry="11" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.65" transform="rotate(-18 32 32)" />

  <!-- 3D Isometric Ops Cube -->
  <!-- Top Face -->
  <polygon points="32,13 48,22 32,30.5 16,22" fill="url(#favTop)" stroke="#0A0F18" stroke-width="1" stroke-linejoin="round" />
  <!-- Left Face -->
  <polygon points="15,24 31,32 31,50 15,41.5" fill="url(#favLeft)" stroke="#0A0F18" stroke-width="1" stroke-linejoin="round" />
  <!-- Right Face -->
  <polygon points="33,32 49,24 49,41.5 33,50" fill="url(#favRight)" stroke="#0A0F18" stroke-width="1" stroke-linejoin="round" />

  <!-- Center Core Node -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="4.5" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.8" />
</svg>
