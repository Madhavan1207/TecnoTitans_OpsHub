<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="Arial, Helvetica, sans-serif">
<rect width="1100" height="520" fill="#F4F1E8"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D1621"/></marker></defs>
<text x="30" y="40" font-size="26" font-weight="700" fill="#0D1621">OpsHub architecture: Hub -> Builder -> API -> PostgreSQL</text>
<g font-size="13" fill="#0D1621">
<rect x="30" y="70" width="230" height="400" fill="#fff" stroke="#0D1621" stroke-width="3"/><rect x="30" y="70" width="230" height="40" fill="#0D1621"/><text x="45" y="96" fill="#FFDD0A" font-weight="700" font-size="16">1. HUB LAYER (React)</text>
<text x="45" y="135">Login (JWT) + site switcher</text><text x="45" y="158">Module catalogue (13 nodes)</text><text x="45" y="181">User management</text><text x="45" y="204">Theme engine (CSS variables)</text><text x="45" y="227">Cross-unit overview</text>
<rect x="45" y="260" width="200" height="190" fill="#FFF6B8" stroke="#0D1621" stroke-width="2"/><text x="55" y="282" font-weight="700">Site renderer (one for all)</text><text x="55" y="305">config.theme.layout:</text><text x="55" y="325">- sidebar (Central Stores)</text><text x="55" y="345">- top tabs (Service Centre)</text><text x="55" y="365">- icon rail (Distribution)</text><text x="55" y="392">pages + fields + workflow</text><text x="55" y="412">all generated from JSON</text>
<rect x="320" y="70" width="230" height="400" fill="#fff" stroke="#0D1621" stroke-width="3"/><rect x="320" y="70" width="230" height="40" fill="#1D4FB5"/><text x="335" y="96" fill="#fff" font-weight="700" font-size="16">2. BUILDER (React Flow)</text>
<text x="335" y="135">Palette + drag / connect</text><text x="335" y="158">Typed ports and edges</text><text x="335" y="181">Presets (3)</text><text x="335" y="204">Field + formula editor</text><text x="335" y="227">Workflow settings</text><text x="335" y="250">Live validation (shared code)</text>
<rect x="335" y="285" width="200" height="165" fill="#DBEAFE" stroke="#0D1621" stroke-width="2"/><text x="345" y="307" font-weight="700">shared/ (used by both sides)</text><text x="345" y="330">registry.js  13 typed nodes</text><text x="345" y="350">validate.js  graph + schema</text><text x="345" y="370">formula.js   safe calc engine</text><text x="345" y="390">presets.js   presets + demos</text>
<rect x="610" y="70" width="230" height="400" fill="#fff" stroke="#0D1621" stroke-width="3"/><rect x="610" y="70" width="230" height="40" fill="#0D1621"/><text x="625" y="96" fill="#FFDD0A" font-weight="700" font-size="16">3. API (Node / Express)</text>
<text x="625" y="135">/api/auth  /api/sites</text><text x="625" y="158">/api/:siteId/:resource</text><text x="625" y="181">siteContext: live config</text><text x="625" y="204">guard(module, action)</text><text x="625" y="227">JWT + bcrypt + RBAC</text><text x="625" y="250">ScopedRepo (ORM site_id)</text><text x="625" y="273">Transactions + row locks</text><text x="625" y="296">ExcelJS import / export</text>
<rect x="625" y="320" width="200" height="130" fill="#FFF6B8" stroke="#0D1621" stroke-width="2"/><text x="635" y="342" font-weight="700">Release service</text><text x="635" y="365">draft -> validate -> publish</text><text x="635" y="385">immutable versions</text><text x="635" y="405">rollback + deploy history</text><text x="635" y="425">config cache: no restart</text>
<rect x="900" y="70" width="170" height="400" fill="#fff" stroke="#0D1621" stroke-width="3"/><rect x="900" y="70" width="170" height="40" fill="#1D4FB5"/><text x="915" y="96" fill="#fff" font-weight="700" font-size="16">4. POSTGRESQL</text>
<text x="912" y="135">Hub tables:</text><text x="912" y="155">users, sites, members,</text><text x="912" y="173">site_versions (JSONB),</text><text x="912" y="191">deploy_history</text><text x="912" y="225">Business tables:</text><text x="912" y="245">site_id on every row</text><text x="912" y="263">FORCED row level</text><text x="912" y="281">security policy</text><text x="912" y="299">composite FKs</text><text x="912" y="317">CHECK qty &gt;= 0</text><text x="912" y="350">App role opshub_app</text><text x="912" y="368">(not superuser)</text>
</g>
<g stroke="#0D1621" stroke-width="3" marker-end="url(#a)"><line x1="260" y1="250" x2="318" y2="250"/><line x1="550" y1="250" x2="608" y2="250"/><line x1="840" y1="250" x2="898" y2="250"/></g>
<text x="30" y="500" font-size="12" fill="#5B6573">Hub reads the published JSONB config; the Builder edits the draft; the API enforces the live config and site_id; PostgreSQL enforces isolation even if the API has a bug.</text>
</svg>
